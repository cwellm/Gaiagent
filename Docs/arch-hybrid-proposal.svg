<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
<style>
 .t{fill:#1f2933}
 .tw{fill:#ffffff}
 .ts{fill:#52606d;font-size:12px}
 .outer{fill:#f1f5f8;stroke:#8fa3ad;stroke-width:1.5}
 .mid{fill:#dfe7ec;stroke:#5c7080;stroke-width:1.5}
 .core{fill:#2f3e46;stroke:#1b262c;stroke-width:1.5}
 .chip{fill:#ffffff;stroke:#5c7080;stroke-width:1.2}
 .stream{fill:#52606d}
 .tag{fill:#3d5a80;font-size:11px;font-weight:600}
</style>
<rect width="960" height="560" fill="#fafafa"/>
<text x="24" y="30" class="t" font-size="18" font-weight="600">Hybrid proposal — C on the outside, A for registration, B inside the core</text>
<text x="24" y="50" class="ts">Status: proposal, not decided</text>

<rect x="30" y="70" width="900" height="440" rx="10" class="outer"/>
<text x="48" y="94" class="tag">FROM C · ADAPTERS</text>
<text x="48" y="112" class="ts">Ktor HTTP/SSE · Compose UI · ACP · Reaper/Krita bridges · CLI  |  Anthropic · OpenAI · Ollama · MCP · SQLite · keychain</text>

<rect x="90" y="130" width="780" height="330" rx="10" class="mid"/>
<text x="108" y="154" class="tag">FROM A · EXTENSION REGISTRY</text>
<text x="108" y="172" class="ts">ModelProvider · Tool · ContextStrategy · ThinkingStrategy · AutonomyPolicy · WorkflowStep  —  contributed by JAR / script / MCP plugins</text>

<rect x="150" y="190" width="660" height="220" rx="10" class="core"/>
<text x="168" y="214" class="tw" font-weight="600">Core · turn pipeline</text>
<g class="t" font-size="12">
 <rect x="162" y="226" width="84" height="40" rx="5" class="chip"/><text x="204" y="250" text-anchor="middle">Prepare</text>
 <rect x="254" y="226" width="84" height="40" rx="5" class="chip"/><text x="296" y="250" text-anchor="middle">Compress</text>
 <rect x="346" y="226" width="84" height="40" rx="5" class="chip"/><text x="388" y="244" text-anchor="middle">Select</text><text x="388" y="258" text-anchor="middle">model</text>
 <rect x="438" y="226" width="84" height="40" rx="5" class="chip"/><text x="480" y="244" text-anchor="middle">Call</text><text x="480" y="258" text-anchor="middle">model</text>
 <rect x="530" y="226" width="84" height="40" rx="5" class="chip"/><text x="572" y="250" text-anchor="middle">Gate</text>
 <rect x="622" y="226" width="84" height="40" rx="5" class="chip"/><text x="664" y="250" text-anchor="middle">Execute</text>
 <rect x="714" y="226" width="84" height="40" rx="5" class="chip"/><text x="756" y="250" text-anchor="middle">Persist</text>
</g>
<text x="480" y="284" text-anchor="middle" class="tw" font-size="12">strategies and policies = interceptors on named phases</text>
<text x="480" y="300" text-anchor="middle" class="tw" font-size="12">a WorkflowStep is one pipeline run with its own model, thinking level and autonomy</text>

<rect x="162" y="312" width="636" height="36" rx="6" class="stream"/>
<text x="480" y="335" text-anchor="middle" class="tw" font-size="12" font-weight="600">FROM B · typed turn-event stream: observability · approval gating · workflow chaining · UI streaming · audit log</text>

<text x="480" y="372" text-anchor="middle" class="tw" font-size="12">Rules: adapters never reach into the core; plugins only contribute via the registry;</text>
<text x="480" y="390" text-anchor="middle" class="tw" font-size="12">the core emits events but never subscribes to adapters.</text>

<text x="480" y="440" text-anchor="middle" class="ts">The registry is how things get in. The pipeline is how a turn runs. The event stream is how the outside watches.</text>

<text x="480" y="540" text-anchor="middle" class="ts">Open: build the model layer on Koog, or own it and wrap Koog clients as adapters?</text>
</svg>
